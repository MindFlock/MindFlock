[project]
name = "mindflock"
version = "0.14.1"
description = "MindFlock — a private flock of AI coding agents, each in its own git worktree on your own machine; started by your ticket queue (GitHub Issues, Jira, Linear, Shortcut, Asana), merged by you"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "MindFlock", email = "info@mindflock.ai" }
]
requires-python = ">=3.12"
dependencies = [
    "aiohttp",
    "tomli",
    # macOS's built-in speech recognition (backend/web/core/speech_system.py):
    # in the MAIN dependencies because `uv tool install "mindflock[web]"`
    # installs no groups, and the OS engine must work on a fresh install.
    "pyobjc-framework-Speech; sys_platform == 'darwin'",
    # Native Windows (docs/windows.md): process tables and memory where
    # Linux reads /proc; the session host's ConPTY and screen model.
    "psutil",
    "pywinpty; sys_platform == 'win32'",
    "pyte; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/MindFlock/MindFlock"
Repository = "https://github.com/MindFlock/MindFlock"

[project.scripts]
mindflock = "backend.cli:main"

# Install-time extras — the same sets as the dependency groups below, exposed
# as extras so a no-clone install works:  uv tool install "mindflock[web] @ git+…"
# (dependency-groups are a dev/workspace concept; `uv tool install` and pipx
# only see extras).
[project.optional-dependencies]
engine = [
    "pyperclip",
    "ptyprocess; sys_platform != 'win32'",
]
web = [
    "mindflock[engine]",
    "cryptography>=41",  # peer links: Ed25519 identity + self-signed TLS cert
    "fastapi",
    "uvicorn[standard]",
    "segno",
]

[dependency-groups]
dev = [
    "hypothesis",
    # The Windows session host's screen model (backend/session/winmux): a
    # runtime dependency only on Windows, but its tests run everywhere.
    "pyte",
    "pytest",
    "pytest-asyncio",
    # CI runs the suite across every runner core (`pytest -n auto`, see
    # docs/development.md); a plain `pytest` stays serial for developers and
    # the run-tests hook — xdist only acts when -n is passed.
    "pytest-xdist",
    # CI passes --timeout so one hung test fails with its traceback instead of
    # silently eating the job's timeout-minutes; inert without the flag.
    "pytest-timeout",
    # Shared git hooks (.pre-commit-config.yaml): workspace auto-setup runs
    # `uv run --all-groups pre-commit install`, so it must be a real dependency.
    "pre-commit",
    # Starlette's TestClient (web-UI contract + route-precedence tests) needs
    # httpx at import time.
    "httpx",
    # Journey tests (tests/e2e) drive the real UI in the system Chrome through
    # Playwright's Python bindings; the package ships its own driver, and the
    # tests point it at /usr/bin/google-chrome, so no `playwright install`.
    "playwright",
]
# The optional speech upgrade (backend/web/core/speech.py, backend id
# "local"): `uv sync --group voice`. The OS's own engines (id "system") need
# nothing from here. Never imported at server start — the backend loads them
# lazily on the first call.
voice = [
    "faster-whisper",
    "piper-tts",
    # The built-in assistant voice (backend/web/core/speech_kokoro.py, backend
    # id "kokoro"): Kokoro-82M on onnxruntime; its model files are a separate
    # download (Settings → Voice installs them).
    "kokoro-onnx>=0.6.1",
]
# Engine deps — needed to run sessions (the session manager / provisioned mode).
#   uv sync --group engine
engine = [
    "pyperclip",
    "ptyprocess; sys_platform != 'win32'",
]
# Everything needed to run the web UI (backend.web): engine deps + FastAPI.
#   uv sync --group web
web = [
    "pyperclip",
    "ptyprocess; sys_platform != 'win32'",
    "fastapi",
    "uvicorn[standard]",
    "segno",  # pure-python QR codes for the startup mobile-URL banner
    "cryptography>=41",  # peer links: Ed25519 identity + self-signed TLS cert
]
[build-system]
requires = ["uv_build>=0.11.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "backend"
module-root = ""
# Keep dev-only files out of the installed wheel: the shell launcher (a source-
# checkout convenience that resolves paths relative to the repo root), the
# per-package orientation READMEs, and any stray logs.
source-exclude = ["**/*.log"]
wheel-exclude = ["**/run.sh", "**/README.md", "**/*.log"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
