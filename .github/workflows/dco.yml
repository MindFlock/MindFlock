# DCO check: every commit in a PR must carry a `Signed-off-by:` trailer
# certifying the contributor wrote the patch (https://developercertificate.org/).
# Contributors add it with `git commit -s`. This replaces the old CLA gate —
# contributions arrive under Apache-2.0 inbound=outbound, so no copyright
# assignment is needed, only provenance.
#
# Deliberately dependency-free: plain git + shell, no third-party action, so
# nothing outside this repo runs against PR refs.
name: DCO

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need the PR commits plus the base to diff against

      - name: Every commit is signed off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          bad=0

          # Merge commits are generated by GitHub, not authored — skip them
          # with --no-merges rather than inspecting each one.
          for sha in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            if git log -1 --format=%B "$sha" \
                 | grep -qiE '^[[:space:]]*Signed-off-by:[[:space:]]+.+[[:space:]]+<[^>]+@[^>]+>'; then
              continue
            fi
            echo "::error::Missing Signed-off-by: $sha $(git log -1 --format=%s "$sha")"
            bad=$((bad + 1))
          done

          if [ "$bad" -gt 0 ]; then
            echo
            echo "$bad commit(s) are missing a Signed-off-by line."
            echo
            echo "MindFlock uses the Developer Certificate of Origin instead of a CLA."
            echo "Signing off certifies you wrote the patch and can submit it under"
            echo "Apache-2.0. There is nothing to sign and no bot to answer."
            echo
            echo "Fix the most recent commit:"
            echo "    git commit --amend -s --no-edit && git push --force-with-lease"
            echo
            echo "Fix every commit on this branch:"
            echo "    git rebase --signoff origin/main && git push --force-with-lease"
            echo
            echo "Going forward, just commit with -s:"
            echo "    git commit -s -m 'your message'"
            exit 1
          fi

          echo "All commits are signed off."
