# CI proof, not hope: build + full test suite on Linux and macOS, plus a
# cold-install job that runs the curl-style installer on a bare container and
# drives the scripted quickstart against a stub agent (no API credentials).
#
# WSL note: a WSL2 guest is a Linux userland, so ubuntu-latest is the
# representative host. The WSL-specific code paths (osenv detection via
# /proc + WSL_* env, wt.exe/wsl.exe terminal launch argv) are unit-tested
# directly (tests/unit/test_osenv.py, test_ide_launch.py, test_pr_pipeline.py)
# and run in this same matrix.
name: CI

# An unfiltered `push:` alongside `pull_request:` ran this whole matrix TWICE
# for every PR — two ubuntu suites, two macOS suites (~3 min each), two cold
# installs — on byte-identical trees, and `gh pr checks` showed every job
# doubled. Scope the push trigger to the branches nothing opens a PR for:
# main (so a direct push is still checked, which is why `format` covers the
# whole tree) and tags (the `versions` job asserts the tag matches the
# manifests, and that only has a tag to read on a tag push).
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  format:
    # Black over the whole package + suite, on every event. This used to run
    # only on pull_request, and only over the files that PR touched — so a
    # direct push to main was never format-checked at all, and that is exactly
    # how unformatted files reached main. The tree is uniformly formatted and
    # black takes seconds over it, so checking all of it removes both holes
    # (and the dependency on github.base_ref, which a push doesn't have).
    name: format (black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.12"
      - name: black --check
        run: uvx black --check --target-version py312 backend tests

  versions:
    # The version lives in three manifests (pyproject.toml, electron/ and
    # frontend/package.json); scripts/bump-version.py is the one writer and
    # this is its guard. On a tag push it additionally asserts the code
    # matches the tag, so a v0.1.4 tag on 0.1.3 manifests fails the build.
    # Stdlib-only, so plain python3 — no uv/deps needed.
    name: version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Manifests agree (and match tag on tagged builds)
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            python3 scripts/bump-version.py --check --expect "${GITHUB_REF_NAME}"
          else
            python3 scripts/bump-version.py --check
          fi

  frontend:
    # The committed bundle IS what ships: `uv build` puts
    # backend/web/static/app.js in the wheel verbatim and electron-builder
    # packages the same tree — neither ever runs vite. So a frontend/src edit
    # without `npm run build` releases a UI that silently lags its own source,
    # and nothing else in this pipeline would notice. Rebuild and demand the
    # tree come back identical.
    #
    # Corollary, so the next person does not go hunting: this job is RED on
    # every dependabot frontend PR, and that is not a bug in the bump. React is
    # bundled into app.js and dependabot never runs vite, so its commit is a
    # lockfile without the build that belongs to it. Such a PR goes green only
    # once someone checks the branch out, runs `npm run build` and commits
    # backend/web/static/ — see the `groups:` note in .github/dependabot.yml,
    # which at least makes that one rebuild per week rather than one per bump.
    name: frontend bundle is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # `npm ci` (not install) so a lockfile that can't resolve — e.g. a plugin
      # major that outgrew the pinned vite — fails here instead of at release.
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Unit tests
        run: npm test
        working-directory: frontend
      # The same script the pre-push hooks run, so a green push and a green CI
      # cannot mean different things. It rebuilds (tsc --noEmit included, so a
      # type error fails here too) and diffs the result.
      - name: Bundle matches frontend/src
        run: ./scripts/check-bundle-fresh.sh

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.12"

      - name: Install tmux (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Install tmux (macOS)
        if: runner.os == 'macOS'
        run: brew install tmux

      - name: Sync dependencies
        run: uv sync --group web --group dev

      # Includes the Phase-2 failure-path tests (tests/unit/test_preflight.py):
      # mid-rebase/merge/cherry-pick/bisect blocks, ctrl-C worktree rollback,
      # doctor version gates, per-distro fix commands.
      - name: Run test suite
        run: uv run pytest -q

  e2e:
    # Journey tests (tests/e2e): the committed bundle, served by a real
    # server with a stub agent, driven in headless Chrome through the first
    # ten minutes a user has — setup card, New session, close + reopen,
    # Settings → Connections, the Ctrl+W guard. They assert on visible text
    # and DOM state so a UX rough edge cannot come back silently.
    #
    # NOT in the required set, and `continue-on-error` so a browser hiccup
    # cannot block a release while the harness is new: a red run here is a
    # signal to read, not a gate. Drop continue-on-error once a few releases
    # have shown it steady. Failures upload tests/e2e/_artifacts (a screenshot
    # + the server log per failed journey).
    name: e2e journeys (headless Chrome)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.12"

      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux

      # ubuntu-latest ships google-chrome; install it only when it doesn't,
      # so the job keeps working on a leaner image.
      - name: Install Chrome if the runner lacks it
        run: |
          if command -v google-chrome >/dev/null 2>&1 || command -v google-chrome-stable >/dev/null 2>&1; then
            echo "chrome present: $(google-chrome --version 2>/dev/null || google-chrome-stable --version)"
            exit 0
          fi
          curl -fsSL -o /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y /tmp/chrome.deb

      - name: Sync dependencies
        run: uv sync --group web --group dev

      - name: Run the journeys
        run: uv run pytest tests/e2e -q -rxs
        env:
          MINDFLOCK_E2E_SHOTS: "1"

      - name: Upload screenshots + server logs
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-artifacts
          path: tests/e2e/_artifacts
          if-no-files-found: ignore

  cold-install:
    name: cold install + quickstart (bare container)
    runs-on: ubuntu-latest
    # A bare Debian container: no dev setup, no Python tooling — the installer
    # must bring everything except the OS packages a stranger is told to have.
    #
    # Deliberately WITHOUT `gh`. gh is optional (pushing is plain `git push`
    # over the user's own remote; only PR create/merge prefer it, and they fall
    # back to the REST API and then to a browser URL), so this job is the only
    # place that proves it: if anything on the path to a first session starts
    # requiring gh again, cold-install is the check that fails. Do not install
    # gh here to make something pass — fix the thing that needs it.
    container: debian:bookworm-slim
    steps:
      - name: Install the OS-level prerequisites (what the README tells users to install)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            curl ca-certificates git tmux procps python3

      - uses: actions/checkout@v5

      # MINDFLOCK_INSTALL_LOCAL installs THIS checkout — never the newest
      # release install.sh defaults to (a PR's merge commit isn't on the
      # remote, so MINDFLOCK_INSTALL_REF=<sha> could not fetch it anyway). The
      # safe.directory line lets the installer read the checkout's commit for
      # install.json under this step's HOME (the checkout is owned by the
      # runner's uid, the container runs as root).
      - name: Run the installer from the checkout under test
        run: |
          git config --global --add safe.directory "$PWD"
          MINDFLOCK_INSTALL_LOCAL="$PWD" sh install.sh
        env:
          # The container's HOME; uv installs itself + mindflock under it.
          HOME: /root

      - name: install.json records a uv-tool install of this checkout
        run: |
          git config --global --add safe.directory "$PWD"
          python3 -I - "$HOME/.mindflock/install.json" "$(git rev-parse HEAD)" <<'EOF'
          import json, sys
          rec = json.load(open(sys.argv[1]))
          print(rec)
          assert rec["method"] == "uv-tool", rec
          assert rec["ref"] == "local" and rec["python"] == "3.12", rec
          assert rec["sha"] == sys.argv[2], (rec["sha"], sys.argv[2])
          assert rec["at"].endswith("Z") and "T" in rec["at"], rec
          EOF
        env:
          HOME: /root

      - name: Scripted quickstart against a stub agent (no credentials)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          git config --global user.email ci@example.com
          git config --global user.name ci
          MINDFLOCK_STUB_AGENT=1 sh scripts/quickstart-verify.sh
        env:
          HOME: /root
