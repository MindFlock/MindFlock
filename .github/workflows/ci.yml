# CI proof, not hope: build + full test suite on Linux and macOS, plus a
# cold-install job that runs the curl-style installer on a bare container and
# drives the scripted quickstart against a stub agent (no API credentials).
#
# WSL note: a WSL2 guest is a Linux userland, so ubuntu-latest is the
# representative host. The WSL-specific code paths (osenv detection via
# /proc + WSL_* env, wt.exe/wsl.exe terminal launch argv) are unit-tested
# directly (tests/unit/test_osenv.py, test_ide_launch.py, test_pr_pipeline.py)
# and run in this same matrix.
name: CI

on:
  push:
  pull_request:

jobs:
  format:
    # Black on changed files only. The tree is uniformly black-formatted; this
    # gate keeps it that way by checking the Python files touched in each PR.
    # Mirrors the shared pre-commit config (.pre-commit-config.yaml).
    name: format (black, changed files)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: black --check on changed files
        run: |
          base=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
          files=$(git diff --name-only --diff-filter=d "$base" -- 'backend/*.py' 'backend/**/*.py' 'tests/*.py' 'tests/**/*.py')
          if [ -n "$files" ]; then
            echo "$files" | xargs uvx black --check --target-version py312
          else
            echo "No Python changes to check."
          fi

  versions:
    # The version lives in three manifests (pyproject.toml, electron/ and
    # frontend/package.json); scripts/bump-version.py is the one writer and
    # this is its guard. On a tag push it additionally asserts the code
    # matches the tag, so a v0.1.4 tag on 0.1.3 manifests fails the build.
    # Stdlib-only, so plain python3 — no uv/deps needed.
    name: version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Manifests agree (and match tag on tagged builds)
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            python3 scripts/bump-version.py --check --expect "${GITHUB_REF_NAME}"
          else
            python3 scripts/bump-version.py --check
          fi

  frontend:
    # The committed bundle IS what ships: `uv build` puts
    # backend/web/static/app.js in the wheel verbatim and electron-builder
    # packages the same tree — neither ever runs vite. So a frontend/src edit
    # without `npm run build` releases a UI that silently lags its own source,
    # and nothing else in this pipeline would notice. Rebuild and demand the
    # tree come back identical.
    name: frontend bundle is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # `npm ci` (not install) so a lockfile that can't resolve — e.g. a plugin
      # major that outgrew the pinned vite — fails here instead of at release.
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Unit tests
        run: npm test
        working-directory: frontend
      # Runs tsc --noEmit first, so a type error is a CI failure too.
      - name: Rebuild the bundle
        run: npm run build
        working-directory: frontend
      - name: Bundle matches frontend/src
        run: |
          if ! git diff --quiet -- backend/web/static/; then
            echo "::error::backend/web/static/ is stale — run 'cd frontend && npm run build' and commit the result."
            git diff --stat -- backend/web/static/
            exit 1
          fi
          echo "Bundle is current."

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install tmux (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Install tmux (macOS)
        if: runner.os == 'macOS'
        run: brew install tmux

      - name: Sync dependencies
        run: uv sync --group web --group dev

      # Includes the Phase-2 failure-path tests (tests/unit/test_preflight.py):
      # mid-rebase/merge/cherry-pick/bisect blocks, ctrl-C worktree rollback,
      # doctor version gates, per-distro fix commands.
      - name: Run test suite
        run: uv run pytest -q

  cold-install:
    name: cold install + quickstart (bare container)
    runs-on: ubuntu-latest
    # A bare Debian container: no dev setup, no Python tooling — the installer
    # must bring everything except the OS packages a stranger is told to have.
    container: debian:bookworm-slim
    steps:
      - name: Install the OS-level prerequisites (what the README tells users to install)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            curl ca-certificates git tmux procps python3
          # gh is a required dep per the README; it isn't in Debian's default
          # repos, so add GitHub's official apt source (mirrors the doctor fix).
          install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
            | tee /etc/apt/keyrings/githubcli-archive-keyring.gpg > /dev/null
          chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
            > /etc/apt/sources.list.d/github-cli.list
          apt-get update
          apt-get install -y --no-install-recommends gh

      - uses: actions/checkout@v4

      - name: Run the installer from the checkout under test
        run: MINDFLOCK_INSTALL_LOCAL="$PWD" sh install.sh
        env:
          # The container's HOME; uv installs itself + mindflock under it.
          HOME: /root

      - name: Scripted quickstart against a stub agent (no credentials)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          git config --global user.email ci@example.com
          git config --global user.name ci
          MINDFLOCK_STUB_AGENT=1 sh scripts/quickstart-verify.sh
        env:
          HOME: /root
