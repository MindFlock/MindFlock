# CLA Assistant Lite: every outside PR is blocked until the author has signed
# the CLA (CLA.md) by posting the signature comment. Signatures are recorded
# as JSON on the `cla-signatures` branch of this repo — auditable, versioned,
# and no external service holds the records.
name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: "signatures/version1/cla.json"
          path-to-document: "https://github.com/MindFlock/MindFlock/blob/main/CLA.md"
          branch: "cla-signatures"
          allowlist: dependabot[bot],*[bot]
          custom-notsigned-prcomment: >
            Thanks for the contribution! Before we can merge, we need you to
            sign the [Contributor License Agreement](https://github.com/MindFlock/MindFlock/blob/main/CLA.md)
            (it lets MindFlock keep the option to dual-license future versions
            and the hosted services legally clean). Sign by posting the comment below.
          custom-pr-sign-comment: "I have read the CLA Document and I hereby sign the CLA"
          custom-allsigned-prcomment: "All contributors have signed the CLA ✍️ ✅"
