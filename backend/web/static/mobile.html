<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- interactive-widget=resizes-content: the soft keyboard RESIZES the layout
       viewport instead of panning over it (Chrome 108+), so no blank band
       appears next to the key bar while composing. iOS ignores it — the
       visualViewport offset compensation in mobile.js covers that path. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0f1117" />
  <title>MindFlock — Mobile</title>
  <!-- Apply the cached appearance before first paint; mobile.js then syncs the
       server copy (ui.accent / ui.surface) so the phone matches the desktop. -->
  <script>try{var _a=localStorage.getItem('cs_accent');if(_a)document.documentElement.setAttribute('data-accent',_a);var _s=localStorage.getItem('cs_surface');if(_s)document.documentElement.setAttribute('data-surface',_s);}catch(e){}</script>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="stylesheet" href="/vendor/xterm.css" />
  <link rel="stylesheet" href="/mobile.css" />
  <link rel="stylesheet" href="/theme.css" />
</head>
<body>
  <div id="app">
    <header id="bar">
      <span id="dot" class="dot offline" title="agent activity"></span>
      <select id="picker" aria-label="Session"></select>
      <div id="tabs">
        <button type="button" class="tab active" data-tab="agent">Agent</button>
        <button type="button" class="tab" data-tab="shell">Shell</button>
        <!-- Read the work before you approve it: the same diff the desktop
             pane's Diff tab shows, unified and colorized for a narrow screen. -->
        <button type="button" class="tab" data-tab="diff">Diff</button>
      </div>
      <!-- Start work from the phone. Everything else on this bar is about the
           session you are looking at; this is the one control that has to exist
           when there is nothing to look at, which is why it lives up here and
           not in the git action bar (that row acts on the selected session and
           disables itself when there isn't one). -->
      <button type="button" id="new-btn" aria-label="New session">+</button>
    </header>

    <!-- Git workflow bar: the same guided flow the desktop pane header offers
         (Commit → Push → PR → Merge). The step recommended for the selected
         session's stage is highlighted; every button stays tappable so you can
         drive the whole flow from a phone without the desktop view. -->
    <div id="actions">
      <button type="button" class="act" data-act="commit">Commit</button>
      <button type="button" class="act" data-act="push">Push</button>
      <button type="button" class="act" data-act="pr">PR</button>
      <button type="button" class="act" data-act="merge">Merge</button>
    </div>

    <div id="term-wrap">
      <div id="term"></div>
      <!-- The placeholder IS the button. This line used to send the reader off
           to the desktop view to create a session, which is the one instruction
           a first-run user holding a phone cannot follow — there is no desktop
           in front of them. -->
      <button type="button" id="empty" class="hidden">No sessions yet — tap to start one</button>
      <div id="status" class="hidden"></div>
    </div>

    <!-- Diff panel: takes the terminal's place under the Diff tab (the PTY
         stays connected behind it, so switching back is instant). Unified only
         — a split view needs width a phone doesn't have. -->
    <div id="diff-wrap" class="hidden">
      <div id="diff-head">
        <button type="button" id="diff-base" class="diff-btn">All changes</button>
        <span id="diff-stat"></span>
        <button type="button" id="diff-refresh" class="diff-btn">Refresh</button>
      </div>
      <div id="diff-body"></div>
    </div>

    <!-- Native compose box: type/paste/autocorrect like any phone text field,
         then send the whole line to the PTY at once. The terminal itself stays
         tappable for raw keystroke mode. Text box above the key bar (user
         preference); both stay visible while typing because applyViewport
         clamps + polls the app height while the keyboard settles. -->
    <div id="composer">
      <textarea id="compose" rows="1" placeholder="Type here — Send delivers it with Enter"
                autocomplete="on" autocapitalize="none" spellcheck="false"
                aria-label="Compose input"></textarea>
      <button type="button" id="send" aria-label="Send">Send</button>
    </div>

    <!-- Keys that are awkward or impossible on a phone soft-keyboard. -->
    <div id="keys">
      <button type="button" class="key" data-key="esc">esc</button>
      <button type="button" class="key sticky" id="ctrl">ctrl</button>
      <button type="button" class="key" data-key="tab">tab</button>
      <button type="button" class="key" data-key="up">↑</button>
      <button type="button" class="key" data-key="down">↓</button>
      <button type="button" class="key" data-key="left">←</button>
      <button type="button" class="key" data-key="right">→</button>
      <button type="button" class="key" data-key="enter">⏎</button>
    </div>

    <!-- Commit-message sheet: commit needs a message, so tapping Commit slides
         this up instead of firing immediately. Mirrors the desktop CommitDialog
         (multiline; first line is the summary). -->
    <div id="commit-sheet" class="sheet hidden">
      <div class="sheet-box">
        <div class="sheet-title">Commit</div>
        <textarea id="commit-text" rows="4"
                  autocomplete="off" autocapitalize="sentences" spellcheck="true"
                  placeholder="Short summary line&#10;&#10;Optional longer description…"
                  aria-label="Commit message"></textarea>
        <div class="sheet-actions">
          <button type="button" id="commit-cancel">Cancel</button>
          <button type="button" id="commit-ok">Commit</button>
        </div>
      </div>
    </div>

    <!-- New-session sheet: three screens in one box, one input each.
         Step 1 is a single sentence, which POST /api/session-plan turns into
         the very fields the desktop New Session dialog owns; step 2 is the
         review; the folder list is both the no-model fallback and the way to
         correct a plan that picked the wrong repo.

         Everything the desktop dialog also offers — templates, the folder
         combobox with its three discovery mechanisms, Browse, provisioning,
         workspace strategy, launch flags, the account picker, the model pin —
         is deliberately not here. Each of those has a working default, and the
         way to inherit a default is to send no key at all, so leaving them out
         is not a reduced feature: it is the same session the desktop would
         create with nobody touching Advanced. -->
    <div id="new-sheet" class="sheet hidden">
      <div class="sheet-box">
        <!-- Step 1 — the whole screen is one box. -->
        <div id="new-step1">
          <div class="sheet-title">What do you want to work on?</div>
          <textarea id="new-text" rows="3" maxlength="2000"
                    autocomplete="off" autocapitalize="sentences" spellcheck="true"
                    placeholder="e.g. fix the token refresh bug in acme-api, in a worktree"
                    aria-label="What do you want to work on"></textarea>
          <div class="sheet-actions">
            <button type="button" id="new-cancel">Cancel</button>
            <button type="button" id="new-go">Continue</button>
          </div>
        </div>

        <!-- Step 2 — the review. Two editable fields and three facts; the
             sentence you typed becomes the session's first prompt, so it is
             shown rather than swallowed. -->
        <div id="new-step2" class="hidden">
          <div class="sheet-title">Start this session?</div>
          <label class="new-label" for="new-title">Name</label>
          <input id="new-title" type="text" maxlength="60"
                 autocomplete="off" autocapitalize="none" spellcheck="false"
                 aria-label="Session name" />
          <div class="new-label">Folder</div>
          <!-- A BUTTON, not a field. There is no free-text folder input on this
               page on purpose: _prepare_plain_repo realpaths whatever it is
               handed against the SERVER's cwd and then makedirs it, which is how
               typing "api" once created a MindFlock/api directory. Every folder
               here came out of a walk of the filesystem the server did itself. -->
          <button type="button" id="new-folder" class="new-row">
            <span id="new-folder-name"></span>
            <span class="new-row-hint">Change</span>
          </button>
          <div id="new-mode" class="new-muted"></div>
          <div id="new-note" class="new-muted hidden"></div>
          <!-- The confirm gate. Shown only when the plan's folder does not exist
               yet, unticked every time, and Start refuses while it is unticked.
               Creating a directory is the one thing a plan proposes that
               outlives the session: closing a session takes its worktree with
               it, but nobody ever comes back for the folder. -->
          <label id="new-confirm-row" class="new-confirm hidden">
            <input type="checkbox" id="new-confirm" />
            <span>
              <span id="new-confirm-label"></span>
              <span class="new-muted">Nothing is there yet. Ticking this makes
                the directory itself — which is not the same thing as creating a
                git repo in it — and the folder stays on this machine after the
                session is closed.</span>
            </span>
          </label>
          <label class="new-label" for="new-prompt">First prompt</label>
          <textarea id="new-prompt" rows="3"
                    autocomplete="off" autocapitalize="sentences" spellcheck="true"
                    aria-label="First prompt"></textarea>
          <div class="sheet-actions">
            <button type="button" id="new-back">Back</button>
            <button type="button" id="new-start">Start session</button>
          </div>
        </div>

        <!-- The folder list: GET /api/repos/suggest, the same rows the desktop
             dialog's suggestion chips show. Reached when the plan route answers
             502 (no CLI installed, a timeout, an unreadable answer) — on a phone
             that must not be a dead end — and reached deliberately from step 2,
             because a plan that picked the wrong repo has to be correctable
             without walking to a desktop. -->
        <div id="new-folders" class="hidden">
          <div class="sheet-title">Which folder?</div>
          <div id="new-folders-msg" class="new-muted"></div>
          <div id="new-folder-list"></div>
          <div class="sheet-actions">
            <button type="button" id="new-folders-back">Back</button>
          </div>
        </div>

        <!-- Outside the three screens, so a refusal (the confirm gate, a 409 on
             a name that already exists) is readable whichever one is up — and
             it sits directly under the actions row your thumb just left. -->
        <div id="new-error" class="new-error hidden" aria-live="polite"></div>
      </div>
    </div>
  </div>

  <script src="/vendor/xterm.js"></script>
  <script src="/vendor/xterm-addon-fit.js"></script>
  <script src="/mobile.js"></script>
</body>
</html>
